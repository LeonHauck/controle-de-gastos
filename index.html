<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Gastos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path d="M12 2v20M17 5.5c0-1.93-2.24-3.5-5-3.5S7 3.57 7 5.5 9.24 9 12 9s5 1.57 5 3.5-2.24 3.5-5 3.5-5-1.57-5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <h1>Controle de Gastos</h1>
      </div>
      <div class="period-filter">
        <label for="period-select" class="visually-hidden">Período</label>
        <select id="period-select"></select>
      </div>
    </header>

    <section class="hero-grid" aria-label="Resumo do período">
      <div class="hero-balance">
        <div class="hero-balance-glow" aria-hidden="true"></div>
        <span class="hero-label">Saldo do período</span>
        <span class="hero-value" id="stat-balance">R$ 0,00</span>
        <div class="hero-chips">
          <span class="chip chip-good">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="stat-income">R$ 0,00</span>
          </span>
          <span class="chip chip-critical">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12l7 7 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="stat-expense">R$ 0,00</span>
          </span>
        </div>
      </div>
      <div class="hero-count">
        <span class="stat-label">Transações no período</span>
        <span class="stat-value" id="stat-count">0</span>
      </div>
    </section>

    <section class="main-grid">
      <div class="panel form-panel">
        <h2>Nova transação</h2>
        <form id="transaction-form">
          <div class="type-toggle" role="radiogroup" aria-label="Tipo de transação">
            <span class="type-slider" aria-hidden="true"></span>
            <button type="button" class="type-btn active" data-type="despesa">Despesa</button>
            <button type="button" class="type-btn" data-type="receita">Receita</button>
          </div>
          <input type="hidden" id="type" value="despesa" />

          <label for="description">Descrição</label>
          <input type="text" id="description" placeholder="Ex: Supermercado" required maxlength="60" />

          <div class="field-row">
            <div class="field">
              <label for="amount">Valor (R$)</label>
              <input type="number" id="amount" placeholder="0,00" min="0.01" step="0.01" required />
            </div>
            <div class="field">
              <label for="date">Data</label>
              <input type="date" id="date" required />
            </div>
          </div>

          <label for="category">Categoria</label>
          <select id="category"></select>

          <button type="submit" class="submit-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Adicionar
          </button>
        </form>
      </div>

      <div class="panel chart-panel">
        <h2>Despesas por categoria</h2>
        <div id="chart-container" class="chart-container">
          <p class="empty-state" id="chart-empty">Nenhuma despesa neste período.</p>
        </div>
      </div>
    </section>

    <section class="panel table-panel">
      <div class="table-header">
        <h2>Transações</h2>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th class="col-amount">Valor</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="transactions-body"></tbody>
        </table>
        <p class="empty-state" id="table-empty">Nenhuma transação ainda. Adicione a primeira ao lado.</p>
      </div>
    </section>

    <footer class="app-footer">Desenvolvido por Leon Hauck</footer>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
